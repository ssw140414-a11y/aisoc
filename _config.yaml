title: ssw140414-a11y
description: An engaging 1-3 sentence description of your lab.
header: /images/image.png
footer: /images/background.jpg
proofer: false
links:
  email: contact@ssw140414-a11y.com
  orcid: 0000-0001-8713-9213
  google-scholar: ETJoidYAAAAJ
  github: ssw140414-a11y
  twitter: ssw140414-a11y
  youtube: ssw140414-a11y
defaults:
  - values:
      layout: default
  - scope:
      type: members
    values:
      layout: member
  - scope:
      type: posts
    values:
      layout: post
collections:
  members:
    output: true
  posts:
    output: true
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at
highlighter: rouge
sass:
  sass_dir: _styles
include:
  - _styles
  - _scripts
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
