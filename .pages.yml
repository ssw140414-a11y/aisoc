settings:
  content:
    merge: true
  commit:
    identity: user

media:
  input: images
  output: /images

content:

  # =========================================================
  # MEMBERS
  # =========================================================
  - name: members
    label: Members
    type: collection
    path: _members
    format: yaml-frontmatter

    filename:
      template: "{primary}.md"
      field: create

    view:
      primary: name
      fields:
        - name
        - role
        - affiliation
      sort:
        - name
        - role
      search:
        - name
        - role
        - affiliation

    fields:
      - name: name
        label: Name
        type: string
        required: true

      - name: image
        label: Profile Image
        type: image

      - name: role
        label: Role
        type: string
        description: "Example: pi, phd, postdoc, undergraduate"

      - name: affiliation
        label: Affiliation
        type: string

      - name: aliases
        label: Aliases
        type: string
        list: true

      - name: links
        label: Links
        type: object
        fields:
          - name: home-page
            label: Homepage
            type: string

          - name: email
            label: Email
            type: string

          - name: github
            label: GitHub
            type: string

          - name: orcid
            label: ORCID
            type: string

          - name: google-scholar
            label: Google Scholar
            type: string

          - name: linkedin
            label: LinkedIn
            type: string

      - name: body
        label: Biography
        type: rich-text
        options:
          format: markdown
          switcher: true


  # =========================================================
  # NEWS / BLOG
  # =========================================================
  - name: news
    label: News
    type: collection
    path: _posts
    format: yaml-frontmatter

    filename:
      template: "{year}-{month}-{day}-{title}.md"
      field: create

    view:
      primary: title
      fields:
        - title
        - author
        - tags
      search:
        - title
        - author
        - tags

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: author
        label: Author
        type: reference
        options:
          collection: members
          value: "{name}"
          label: "{primary}"
          search: "name,role,affiliation"

      - name: tags
        label: Tags
        type: string
        list: true

      - name: body
        label: Content
        type: rich-text
        options:
          format: markdown
          switcher: true


  # =========================================================
  # PUBLICATIONS
  # =========================================================
  - name: publications
    label: Publications
    type: file
    path: _data/sources.yaml
    format: yaml
    list: true

    fields:
      - name: id
        label: DOI / arXiv / PubMed ID
        type: string
        description: "Example: doi:10.1109/XXXX.2026.1234567 or arxiv:2601.12345"

      - name: type
        label: Type
        type: select
        options:
          values:
            - paper
            - preprint
            - book
            - webpage

      - name: title
        label: Title
        type: string
        description: "Usually leave blank when using a DOI; Manubot can generate it automatically."

      - name: authors
        label: Authors
        type: string
        list: true

      - name: publisher
        label: Publisher / Journal
        type: string

      - name: date
        label: Publication Date
        type: date

      - name: link
        label: Link
        type: string

      - name: image
        label: Thumbnail
        type: image

      - name: description
        label: Description
        type: rich-text
        options:
          format: markdown
          switcher: true

      - name: repo
        label: GitHub Repository
        type: string
        description: "Example: owner/repository"

      - name: tags
        label: Tags
        type: string
        list: true

      - name: buttons
        label: Buttons
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{type}"
        fields:
          - name: type
            label: Button Type
            type: string

          - name: text
            label: Button Text
            type: string

          - name: link
            label: URL
            type: string

      - name: remove
        label: Hide publication
        type: boolean


  # =========================================================
  # PROJECTS
  # =========================================================
  - name: projects
    label: Projects
    type: file
    path: _data/projects.yaml
    format: yaml
    list: true

    fields:
      - name: title
        label: Project Name
        type: string
        required: true

      - name: subtitle
        label: Subtitle
        type: string

      - name: group
        label: Group
        type: select
        options:
          values:
            - featured

      - name: image
        label: Project Image
        type: image

      - name: link
        label: Project URL
        type: string

      - name: description
        label: Description
        type: rich-text
        options:
          format: markdown
          switcher: true

      - name: repo
        label: GitHub Repository
        type: string
        description: "Example: owner/repository"

      - name: tags
        label: Tags
        type: string
        list: true


  # =========================================================
  # SITE SETTINGS
  # =========================================================
  - name: site-settings
    label: Site Settings
    type: file
    path: _config.yaml
    format: yaml

    fields:
      - name: title
        label: Lab Name
        type: string
        required: true

      - name: subtitle
        label: Subtitle
        type: string

      - name: description
        label: Site Description
        type: text

      - name: header
        label: Header Background
        type: image

      - name: footer
        label: Footer Background
        type: image

      - name: proofer
        label: Link Proofer
        type: boolean

      - name: links
        label: Lab Links
        type: object
        fields:
          - name: email
            label: Email
            type: string

          - name: orcid
            label: ORCID
            type: string

          - name: google-scholar
            label: Google Scholar
            type: string

          - name: github
            label: GitHub
            type: string

          - name: twitter
            label: Twitter / X
            type: string

          - name: youtube
            label: YouTube
            type: string